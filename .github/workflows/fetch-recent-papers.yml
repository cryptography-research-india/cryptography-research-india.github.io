name: Fetch Recent Papers

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch:       # run manually from the Actions tab whenever you want to refresh

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Fetch recent papers
        id: fetch
        run: |
          python .github/scripts/fetch_recent_papers.py
          echo "changed=$(git status --porcelain | grep -c '' || true)" >> $GITHUB_OUTPUT

      - name: Create PR with updated papers feed
        if: steps.fetch.outputs.changed != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            execSync('git config user.name  "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

            const branch = `bot/recent-papers-${Date.now()}`;
            execSync(`git checkout -b ${branch}`);
            execSync('git add _data/recent_papers.yml');
            execSync('git commit -m "Update recent papers feed"');
            execSync(`git push origin ${branch}`);

            const dataYaml = fs.readFileSync('_data/recent_papers.yml', 'utf8');

            const pr = await github.rest.pulls.create({
              ...context.repo,
              title: 'Update recent papers feed',
              body: [
                '## Recent papers feed refreshed',
                '',
                'Auto-fetched from the [IACR ePrint Archive](https://eprint.iacr.org/) and matched against the researcher directory by full name.',
                '',
                '### Before merging',
                '- [ ] Spot-check that matched papers are actually by the right person (not a name collision)',
                '',
                '<details><summary>Full contents of _data/recent_papers.yml</summary>',
                '',
                '```yaml',
                dataYaml,
                '```',
                '</details>',
                '',
                '*Generated by the Fetch Recent Papers workflow.*',
              ].join('\n'),
              head: branch,
              base: 'master',
            });

            console.log('PR created:', pr.data.html_url);

      - name: No changes
        if: steps.fetch.outputs.changed == '0'
        run: echo "No changes to the recent papers feed — nothing to commit."
