name: Add Researcher
description: Add yourself or a colleague to the CRIYPT researchers directory
labels: ["add-researcher"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to CRIYPT! Fill in the details below and a PR will be created automatically for review.

  - type: input
    id: name
    attributes:
      label: Full Name
      placeholder: e.g. Arpita Patra
    validations:
      required: true

  - type: input
    id: designation
    attributes:
      label: Designation
      placeholder: e.g. Associate Professor
    validations:
      required: true

  - type: input
    id: affiliation
    attributes:
      label: Affiliation
      placeholder: e.g. Indian Institute of Science, Bangalore
    validations:
      required: true

  - type: textarea
    id: research_areas
    attributes:
      label: Research Areas
      description: One per line
      placeholder: |
        Secure Multi-Party Computation
        Cryptographic Protocols
        Applied Cryptography
    validations:
      required: true

  - type: input
    id: webpage
    attributes:
      label: Personal Webpage URL
      placeholder: https://

  - type: input
    id: lab
    attributes:
      label: Lab / Group URL (optional)
      placeholder: https://

  - type: input
    id: email
    attributes:
      label: Email ID (optional)
      placeholder: you@institution.ac.in

  - type: input
    id: orcid
    attributes:
      label: ORCID iD (optional)
      placeholder: e.g. 0000-0002-1825-0097

  - type: input
    id: scholar
    attributes:
      label: Google Scholar Profile URL (optional)
      placeholder: https://scholar.google.com/citations?user=...

  - type: input
    id: dblp
    attributes:
      label: DBLP Profile URL (optional)
      placeholder: https://dblp.org/pid/...

  - type: input
    id: linkedin
    attributes:
      label: LinkedIn Profile URL (optional)
      placeholder: https://www.linkedin.com/in/...

  - type: dropdown
    id: type
    attributes:
      label: Sector
      options:
        - Academia
        - Industry
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: Currently based in
      options:
        - India
        - Abroad
    validations:
      required: true
