<header class="site-header" id="site-header">
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="{{ '/' | relative_url }}" class="navbar-brand">
        <img src="{{ '/assets/images/bio-photo-new-transparent.png' | relative_url }}"
             alt="Cryptography Researchers of India"
             class="brand-logo logo-dark">
        <img src="{{ '/assets/images/bio-photo-new-transparent-light.png' | relative_url }}"
             alt="Cryptography Researchers of India"
             class="brand-logo logo-light">
      </a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>

      <ul class="nav-links" id="nav-links">
        <li>
          <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">Home</a>
        </li>
        <li>
          <a href="{{ '/people/' | relative_url }}" class="nav-link{% if page.url contains '/people' %} active{% endif %}">People</a>
        </li>
        <li>
          <a href="{{ '/posts/' | relative_url }}" class="nav-link{% if page.url contains '/posts' or page.layout == 'post' %} active{% endif %}">Posts</a>
        </li>
        <li>
          <a href="{{ '/resources/' | relative_url }}" class="nav-link{% if page.url contains '/resources' %} active{% endif %}">Resources</a>
        </li>
        <li>
          <a href="{{ '/positions/' | relative_url }}" class="nav-link{% if page.url contains '/positions' %} active{% endif %}">Positions</a>
        </li>
        <li>
          <a href="{{ '/collaborations/' | relative_url }}" class="nav-link{% if page.url contains '/collaborations' %} active{% endif %}">Collaborations</a>
        </li>
        <li>
          <a href="{{ '/about/' | relative_url }}" class="nav-link{% if page.url contains '/about' %} active{% endif %}">About</a>
        </li>
      </ul>

      <div class="nav-actions">
        <a href="https://github.com/{{ site.github_username | default: 'cryptography-research-india' }}/cryptography-research-india.github.io"
           class="github-star-btn" target="_blank" rel="noopener" aria-label="Star this project on GitHub">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span class="star-btn-label">Star on GitHub</span>
        </a>

        <!-- Theme toggle -->
        <div class="theme-toggle" id="theme-toggle">
          <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Switch theme" aria-haspopup="true" aria-expanded="false">
            <span id="theme-toggle-icon">🌙</span>
          </button>
          <div class="theme-menu" id="theme-menu">
            <button type="button" class="theme-option" data-theme-btn="dark">🌙 <span>Dark</span></button>
            <button type="button" class="theme-option" data-theme-btn="light">☀️ <span>Light</span></button>
            <button type="button" class="theme-option" data-theme-btn="auto">💻 <span>Auto (system)</span></button>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
