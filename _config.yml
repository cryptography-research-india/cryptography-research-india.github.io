title: Cryptography Researchers of India
description: Connecting cryptography researchers across India
url: "https://cryptography-research-india.github.io"
baseurl: ""
author:
  name: CRIYPT Community
  email: cryptography.research.india@gmail.com

github_username: cryptography-research-india

# Build
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Pagination
paginate: 6
paginate_path: /posts/page:num/

# Include
include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# Collections
collections:
  resources:
    output: true
  positions:
    output: true
    permalink: /positions/:slug/
  collaborations:
    output: true
    permalink: /collaborations/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: positions
    values:
      layout: position
  - scope:
      path: ""
      type: collaborations
    values:
      layout: collaboration
  - scope:
      path: "_pages"
    values:
      layout: page

# Giscus comments
giscus:
  repo: cryptography-research-india/cryptography-research-india.github.io
  repo_id: R_kgDOIDtnYg
  category: Blog Post Comments
